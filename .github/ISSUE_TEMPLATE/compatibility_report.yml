name: Compatibility report
description: Share independent camera/version verification
labels: ["compatibility"]
body:
  - type: input
    id: camera
    attributes:
      label: Camera and firmware
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: Software versions and parser / SDK hashes
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks performed
      description: Include readback, JPEG, live preview, restart and recovery separately. State which were not tested.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Result and limitations
      description: Do not upload camera payloads, descriptors, third-party LUTs or private photos.
    validations:
      required: true
